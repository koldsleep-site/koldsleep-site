<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>koldsleep Archive</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Rubik+Glitch&family=Monoton&family=Creepster&family=Metal+Mania&family=Press+Start+2P&family=Major+Mono+Display&family=Fascinate+Inline&family=Bungee+Shade&family=Codystar&family=Zen+Tokyo+Zoo&family=Pirata+One&family=New+Rocker&family=Black+Ops+One&family=Oi&family=Nosifer&family=Rakkas&family=Stardos+Stencil&family=Rubik+Moonrocks&family=Vast+Shadow&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#titleLink {
  color: #000000;
  text-decoration: none;
  font-size: 25px;
  line-height: 1.2;
  max-width: 90vw;
  word-break: break-word;
}

#titleLink:hover {
  opacity: 0.6;
}

/* ----------------------------------------------------------
   KOLDKITTY
   small fixed canvas only; it does not cover the whole page.
   ---------------------------------------------------------- */

#koldkitty {
  position: fixed;
  left: 0;
  top: 0;
  width: 108px;
  height: 72px;
  z-index: 999999;
  background: transparent;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;

  /* the archive background is white, so keep the cat white
     but give it a tiny rough shadow so it remains visible */
  filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.48));
}


@media (prefers-reduced-motion: reduce) {
  #koldkitty {
    transition: none !important;
  }
}
</style>
</head>

<body>

<a id="titleLink"
   href="https://koldsleep.notion.site/koldsleep-Archive-17c75242e9ff80a591e5c45761d53314?source=copy_link">
   koldsleep Archive
</a>

<canvas id="koldkitty" width="108" height="72" aria-label="koldkitty"></canvas>

<script>
/* ============================================================
   ORIGINAL ARCHIVE TITLE BEHAVIOR
   ============================================================ */

const fonts = [
  "UnifrakturCook",
  "Rubik Glitch",
  "Monoton",
  "Creepster",
  "Metal Mania",
  "Press Start 2P",
  "Major Mono Display",
  "Fascinate Inline",
  "Bungee Shade",
  "Codystar",
  "Zen Tokyo Zoo",
  "Pirata One",
  "New Rocker",
  "Black Ops One",
  "Oi",
  "Nosifer",
  "Rakkas",
  "Stardos Stencil",
  "Rubik Moonrocks",
  "Vast Shadow"
];

const title = document.getElementById("titleLink");

const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
title.style.fontFamily = `'${randomFont}', sans-serif`;

const baseText = "koldsleep Archive";
const modes = ["upper", "lower", "random"];
const mode = modes[Math.floor(Math.random() * modes.length)];

if (mode === "upper") {
  title.textContent = baseText.toUpperCase();
} else if (mode === "lower") {
  title.textContent = baseText.toLowerCase();
} else {
  title.textContent = baseText.split("").map(c =>
    Math.random() > 0.5 ? c.toUpperCase() : c.toLowerCase()
  ).join("");
}


/* ============================================================
   KOLDKITTY WEB v1
   ============================================================ */

(() => {
  "use strict";

  const canvas = document.getElementById("koldkitty");
  const ctx = canvas.getContext("2d", { alpha: true });

  ctx.imageSmoothingEnabled = false;

  const GRID_W = 36;
  const GRID_H = 24;
  const PIXEL = 3;

  const W = GRID_W * PIXEL;
  const H = GRID_H * PIXEL;

  const TOP_GAP = 55;

  const DAY_SPEED = 1.6;
  const NIGHT_SPEED = 18.0;
  const FLEE_MULTIPLIER = 2.2;
  const WATCH_SPEED_MULTIPLIER = 0.42;

  const WATCH_RADIUS = 260;
  const FLEE_RADIUS = 105;
  const SURPRISE_DURATION = 340;

  const WALK = 0;
  const SLEEP = 1;

  const KITTY = 0;
  const PAPER = 1;

  const ARCHIVE_URL =
    "https://koldsleep.notion.site/koldsleep-Archive-17c75242e9ff80a591e5c45761d53314";

  const SLEEPINGSTRING_URL =
    "https://sleepingstring.netlify.app/";

  const KOLDSLEEP_URL =
    "https://koldsleep.netlify.app/";

  const PAPER_REST_TIME = 1800;

  // Browsers usually block a window opened later by an animation/timer.
  // So the user's click reserves a tab/window, and the paper landing
  // navigates that reserved tab to the randomly selected destination.
  let pendingPortalWindow = null;
  let pendingPortalURL = ARCHIVE_URL;

  let x = Math.max(20, window.innerWidth - W - 40);
  let y = TOP_GAP;

  let direction = -1;

  let state = WALK;
  let stateStarted = performance.now();
  let stateDuration = rand(7000, 18000);

  let form = KITTY;

  let cursorX = -10000;
  let cursorY = -10000;

  let watching = false;
  let fleeing = false;
  let surprised = false;

  let wasInsideFleeRadius = false;
  let surpriseStartedAt = 0;

  let pendingPortalChoice = "archive";

  let paperStartX = 0;
  let paperVelocityY = 0;
  let paperPhase = 0;
  let paperAngle = 0;
  let paperLanded = false;
  let paperLandedAt = 0;

  let activeSleepZ = 0;
  let sleepZLiftAmount = 2;
  let sleepZCycleStarted = 0;
  let sleepZCycleDuration = 850;

  let lastFrame = performance.now();

  const walk1Sprite = [
    "....................................",
    "....................................",
    "...##.......##.......................",
    "..####.....####......................",
    ".###############.....................",
    "#################....................",
    ".###############.....................",
    "..##############.....................",
    "..#############......................",
    "...######################...........",
    "....######################..........",
    ".....######################.........",
    "......######################........",
    "......######################........",
    ".......####################.........",
    "........##################..........",
    ".........#####..########............",
    "..........###....#####..............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  const walk2Sprite = [
    "....................................",
    "....................................",
    "...##.......##.......................",
    "..####.....####......................",
    ".###############.....................",
    "#################....................",
    ".###############.....................",
    "..##############.....................",
    "..#############......................",
    "....#####################............",
    ".....######################..........",
    ".....#######################.........",
    "......######################.........",
    ".......#####################.........",
    ".......####################..........",
    "........##################...........",
    ".........#####..#######..............",
    "..........###....#####...............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  const watchSprite = walk1Sprite;

  const sleepSprite = [
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    ".....##.......##.....................",
    "....####.....####....................",
    "...###############..................",
    "..#################.................",
    "..########################..........",
    "...##########################.......",
    "....##########################......",
    ".....#########################......",
    "......########################......",
    "........#####################.......",
    "..........#################.........",
    "............############............",
    "...............########.............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  const paperSprite = [
    "....................................",
    "....................................",
    "....................................",
    "............+++++++++++.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+#########+.............",
    "............+++++++++++.............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function isNight() {
    const h = new Date().getHours();
    return h >= 21 || h < 9;
  }

  function currentSpeed() {
    return isNight() ? NIGHT_SPEED : DAY_SPEED;
  }

  function setCanvasPosition() {
    canvas.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
  }

  function clear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
  }

  function px(gx, gy, color = "#fff") {
    ctx.fillStyle = color;
    ctx.fillRect(gx * PIXEL, gy * PIXEL, PIXEL, PIXEL);
  }

  function drawSprite(sprite) {
    for (let gy = 0; gy < sprite.length; gy++) {
      const row = sprite[gy];
      for (let gx = 0; gx < row.length; gx++) {
        if (row[gx] === "#") {
          px(gx, gy);
        }
      }
    }
  }

  function drawFullerCatFace() {
    // left cheek
    px(1, 6); px(1, 7);
    px(1, 8); px(2, 8);
    px(2, 9); px(3, 9);

    // right cheek — deliberately uneven
    px(15, 6);
    px(15, 7); px(16, 7);
    px(14, 8); px(15, 8);
    px(14, 9);

    // lower face
    px(4, 9); px(5, 9);
    px(11, 9); px(12, 9); px(13, 9);
  }

  function drawFourShortLegs(frame) {
    if (frame === 0) {
      px(9,15); px(9,16); px(8,17); px(7,18);
      px(13,15); px(13,16); px(14,17); px(15,18);
      px(19,15); px(19,16); px(18,17); px(17,18);
      px(23,15); px(23,16); px(24,17); px(25,18);
    } else {
      px(9,15); px(9,16); px(10,17); px(11,18);
      px(13,15); px(13,16); px(12,17); px(11,18);
      px(19,15); px(19,16); px(20,17); px(21,18);
      px(23,15); px(23,16); px(22,17); px(21,18);
    }
  }

  function drawCatTail(frame) {
    if (frame === 0) {
      px(24,13); px(25,13);
      px(26,14); px(27,14); px(28,14);
      px(29,13); px(30,12); px(31,11);
      px(32,10); px(33,9); px(34,8); px(35,8);
    } else {
      px(24,13); px(25,13); px(26,13);
      px(27,14); px(28,14);
      px(29,13); px(30,12); px(31,11);
      px(32,10); px(33,9); px(34,9); px(35,8);
    }
  }

  function drawSleepingTail() {
    px(22,13); px(23,13);
    px(24,14); px(25,14); px(26,14); px(27,14);
    px(28,13); px(29,12); px(30,11);
  }

  function drawWhiskers() {
    ctx.fillStyle = "#fff";

    // left — intentionally unequal
    ctx.fillRect(0, 23, 14, 1);
    ctx.fillRect(2, 28, 12, 1);
    ctx.fillRect(0, 34, 11, 1);

    // right — not mirrored
    ctx.fillRect(38, 22, 15, 1);
    ctx.fillRect(40, 28, 13, 1);
    ctx.fillRect(41, 35, 10, 1);
  }

  function drawSlitEyes() {
    ctx.fillStyle = "#000";
    ctx.fillRect(12, 20, 8, 2);
    ctx.fillRect(28, 21, 8, 2);
  }

  function drawSleepingEyes() {
    ctx.fillStyle = "#000";
    ctx.fillRect(17, 22, 7, 1);
    ctx.fillRect(30, 22, 7, 1);
  }

  function resetSleepZAnimation(now = performance.now()) {
    activeSleepZ = Math.floor(Math.random() * 3);
    sleepZLiftAmount = 1 + Math.floor(Math.random() * 2);
    sleepZCycleDuration = rand(650, 1100);
    sleepZCycleStarted = now;
  }

  function drawSleepZzz(now) {
    if (!sleepZCycleStarted) {
      resetSleepZAnimation(now);
    }

    let elapsed = now - sleepZCycleStarted;

    if (elapsed >= sleepZCycleDuration) {
      activeSleepZ = Math.floor(Math.random() * 3);
      sleepZLiftAmount = 1 + Math.floor(Math.random() * 2);
      sleepZCycleDuration = rand(650, 1100);
      sleepZCycleStarted = now;
      elapsed = 0;
    }

    const t = elapsed / sleepZCycleDuration;
    const lift = Math.round(-sleepZLiftAmount * Math.sin(Math.PI * t));

    const ys = [17, 17, 17];
    ys[activeSleepZ] += lift;

    ctx.fillStyle = "#fff";
    ctx.font = '10pt "Press Start 2P", monospace';
    ctx.textBaseline = "alphabetic";

    ctx.fillText("z", 73, ys[0]);
    ctx.fillText("z", 82, ys[1]);
    ctx.fillText("z", 91, ys[2]);
  }

  function drawBackSpikes() {
    // attached only to the back
    px(13,10); px(13,9); px(12,8);
    px(15,10); px(15,9);
    px(17,10); px(17,9); px(17,8); px(18,7);
    px(20,10); px(20,9); px(21,8);
    px(23,10); px(23,9); px(24,9);
    px(25,11); px(25,10); px(26,9);
  }

  function drawCloseSurprisedEyes() {
    ctx.fillStyle = "#000";

    // left O
    ctx.fillRect(16,17,8,3);
    ctx.fillRect(16,28,8,3);
    ctx.fillRect(13,20,3,8);
    ctx.fillRect(24,20,3,8);

    // right O, very close
    ctx.fillRect(28,17,8,3);
    ctx.fillRect(28,28,8,3);
    ctx.fillRect(26,20,3,8);
    ctx.fillRect(36,20,3,8);
  }

  function drawPaper() {
    ctx.save();

    ctx.translate(W / 2, H / 2);
    ctx.rotate(paperAngle);
    ctx.translate(-W / 2, -H / 2);

    for (let gy = 0; gy < paperSprite.length; gy++) {
      const row = paperSprite[gy];
      for (let gx = 0; gx < row.length; gx++) {
        if (row[gx] === "#") {
          px(gx, gy, "#fff");
        } else if (row[gx] === "+") {
          px(gx, gy, "#b9b9b9");
        }
      }
    }

    ctx.restore();
  }

  function drawCat(now) {
    if (state === SLEEP && !surprised && !fleeing) {
      drawSprite(sleepSprite);
      drawSleepingTail();
      drawSleepingEyes();
      drawSleepZzz(now);
      return;
    }

    const frameSpeed = (fleeing || isNight()) ? 45 : 180;
    const frame = Math.floor(now / frameSpeed) % 2;

    let sprite;
    if (watching || surprised) {
      sprite = watchSprite;
    } else {
      sprite = frame === 0 ? walk1Sprite : walk2Sprite;
    }

    ctx.save();

    if (direction === 1) {
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
    }

    drawSprite(sprite);
    drawFullerCatFace();
    drawFourShortLegs(frame);
    drawCatTail(frame);
    drawWhiskers();

    if (surprised || fleeing) {
      drawBackSpikes();
      drawCloseSurprisedEyes();
    } else {
      drawSlitEyes();
    }

    ctx.restore();
  }

  function lookAtCursor() {
    const center = x + W / 2;
    direction = cursorX < center ? -1 : 1;
  }

  function updateCursorInteraction(now) {
    const centerX = x + W / 2;
    const centerY = y + H / 2;

    const dx = cursorX - centerX;
    const dy = cursorY - centerY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < FLEE_RADIUS) {
      if (!wasInsideFleeRadius) {
        surpriseStartedAt = now;

        if (state === SLEEP) {
          state = WALK;
          stateStarted = now;
          stateDuration = rand(7000, 19000);
        }
      }

      wasInsideFleeRadius = true;

      if (now - surpriseStartedAt < SURPRISE_DURATION) {
        surprised = true;
        fleeing = false;
        watching = false;
      } else {
        surprised = false;
        fleeing = true;
        watching = false;
      }
    } else if (distance < WATCH_RADIUS) {
      wasInsideFleeRadius = false;
      surprised = false;
      fleeing = false;
      watching = state === WALK;
    } else {
      wasInsideFleeRadius = false;
      surprised = false;
      fleeing = false;
      watching = false;
    }
  }

  function constrainX() {
    const maxX = Math.max(0, window.innerWidth - W);

    if (x < 0) {
      x = 0;
      direction = 1;
    }

    if (x > maxX) {
      x = maxX;
      direction = -1;
    }
  }

  function chooseNextState(now) {
    if (state === WALK) {
      state = SLEEP;
      resetSleepZAnimation(now);
      stateDuration = rand(7000, 26000);
    } else {
      state = WALK;
      stateDuration = rand(7000, 19000);

      if (Math.random() < 0.40) {
        direction *= -1;
      }
    }

    stateStarted = now;
  }

  function choosePortalDestination() {
    const roll = Math.random();

    // 50% Notion archive
    if (roll < 0.50) {
      pendingPortalChoice = "archive";
      pendingPortalURL = ARCHIVE_URL;
      return;
    }

    // 25% sleepingstring
    if (roll < 0.75) {
      pendingPortalChoice = "sleepingstring";
      pendingPortalURL = SLEEPINGSTRING_URL;
      return;
    }

    // 25% koldsleep.netlify
    pendingPortalChoice = "koldsleep";
    pendingPortalURL = KOLDSLEEP_URL;
  }

  function reservePortalWindow() {
    // Reuse the same named tab/window rather than creating endless tabs.
    // The original koldkitty page always stays open.
    try {
      pendingPortalWindow = window.open("about:blank", "koldsleepPortal");

      if (pendingPortalWindow) {
        try {
          pendingPortalWindow.document.title = "koldsleep";
        } catch (e) {}
        try {
          window.focus();
        } catch (e) {}
      }
    } catch (e) {
      pendingPortalWindow = null;
    }
  }

  function turnIntoPaper() {
    form = PAPER;

    watching = false;
    fleeing = false;
    surprised = false;
    wasInsideFleeRadius = false;

    // Every click has a destination:
    // 50% Archive / 25% sleepingstring / 25% koldsleep.netlify
    choosePortalDestination();

    // Reserve the new browser tab/window while still inside
    // the user's click gesture, so popup blockers are less likely
    // to reject the landing-time navigation.
    reservePortalWindow();

    paperStartX = x;
    paperVelocityY = 0.50;
    paperPhase = 0;
    paperAngle = -0.20;
    paperLanded = false;
    paperLandedAt = 0;
  }

  function openPortalOnLanding() {
    let opened = false;

    // Preferred path: navigate the tab/window reserved by the click.
    if (
      pendingPortalWindow &&
      !pendingPortalWindow.closed
    ) {
      try {
        pendingPortalWindow.location.href = pendingPortalURL;
        pendingPortalWindow.focus();
        opened = true;
      } catch (e) {
        opened = false;
      }
    }

    // Fallback for browsers that discarded the reserved window.
    // This may be blocked by strict popup settings because landing
    // happens after the original click gesture.
    if (!opened) {
      try {
        const fallback = window.open(
          pendingPortalURL,
          "koldsleepPortal"
        );

        opened = !!fallback;
      } catch (e) {
        opened = false;
      }
    }

    pendingPortalWindow = null;

    return opened;
  }

  function respawn() {
    form = KITTY;
    state = WALK;

    x = rand(
      20,
      Math.max(21, window.innerWidth - W - 20)
    );

    y = TOP_GAP;

    direction = Math.random() < 0.5 ? -1 : 1;

    stateStarted = performance.now();
    stateDuration = rand(7000, 18000);

    paperLanded = false;
    paperLandedAt = 0;
  }

  function updatePaper(now, frameScale) {
    if (!paperLanded) {
      paperPhase += 0.13 * frameScale;
      paperVelocityY += 0.055 * frameScale;
      y += paperVelocityY * frameScale;

      x =
        paperStartX +
        Math.sin(paperPhase) * 30 +
        Math.sin(paperPhase * 0.39) * 10;

      paperAngle =
        Math.sin(paperPhase * 1.35) * 0.55;

      const floorY = Math.max(TOP_GAP, window.innerHeight - H);

      if (y >= floorY) {
        y = floorY;
        paperLanded = true;
        paperLandedAt = now;
        paperAngle = 0.12;

        // Link event is now 100% on every paper landing.
        openPortalOnLanding();
      }
    } else {
      if (now - paperLandedAt > PAPER_REST_TIME) {
        respawn();
      }
    }
  }

  function update(now, dt) {
    const frameScale = Math.min(2.0, Math.max(0.1, dt / 33.333));

    if (form === PAPER) {
      updatePaper(now, frameScale);
      return;
    }

    updateCursorInteraction(now);

    if (surprised) {
      lookAtCursor();
    } else if (fleeing) {
      const center = x + W / 2;
      direction = cursorX < center ? 1 : -1;
      x += currentSpeed() * FLEE_MULTIPLIER * direction * frameScale;
    } else if (watching && state === WALK) {
      x += currentSpeed() * WATCH_SPEED_MULTIPLIER * direction * frameScale;
    } else if (state === WALK) {
      x += currentSpeed() * direction * frameScale;
    }

    if (!surprised && !fleeing && now - stateStarted > stateDuration) {
      chooseNextState(now);
    }

    constrainX();
  }

  function render(now) {
    clear();

    if (form === PAPER) {
      drawPaper();
    } else {
      drawCat(now);
    }

    setCanvasPosition();
  }

  function loop(now) {
    const dt = now - lastFrame;
    lastFrame = now;

    update(now, dt);
    render(now);

    requestAnimationFrame(loop);
  }

  window.addEventListener("pointermove", (e) => {
    cursorX = e.clientX;
    cursorY = e.clientY;
  }, { passive: true });

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (form !== KITTY) return;

    e.preventDefault();
    turnIntoPaper();
  });

  window.addEventListener("resize", () => {
    constrainX();

    if (form === KITTY) {
      y = TOP_GAP;
    }
  });

  setCanvasPosition();
  requestAnimationFrame((now) => {
    lastFrame = now;
    requestAnimationFrame(loop);
  });
})();
</script>

</body>
</html>
