<style>
html, body {
  margin: 0;
  height: 100%;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#titleLink {
  color: #000000;
  text-decoration: none;
  font-size: 25px;
  line-height: 1.2;
  max-width: 90vw;
  word-break: break-word;
}

#archiveLabel { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Arial, sans-serif; font-weight: 400; }
.kw-word {
  display: inline-block;
  white-space: nowrap;
  font-weight: 400;
  font-size: 1em;
  line-height: inherit;
}
.kw-letter {
  display: inline-block;
  position: relative;
  font-size: var(--kw-size, 1em);
  font-weight: 400;
  letter-spacing: var(--kw-tracking, 0em);
  transform: translateY(var(--kw-baseline, 0em)) scaleX(var(--kw-stretch, 1));
  transform-origin: 50% 70%;
  vertical-align: baseline;
  white-space: nowrap;
}

#titleLink:hover {
  opacity: 0.6;
}

/* ----------------------------------------------------------
   KOLDKITTY
   small fixed canvas only; it does not cover the whole page.
   ---------------------------------------------------------- */

#koldkitty {
  position: fixed;
  left: 0;
  top: 0;
  width: 108px;
  height: 72px;
  z-index: 999999;
  background: transparent;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;

  /* the archive background is white, so keep the cat white
     but give it a tiny rough shadow so it remains visible */
  filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.48));
}


@media (prefers-reduced-motion: reduce) {
  #koldkitty {
    transition: none !important;
  }
}

<a id="titleLink"
   href="https://k0ldsleep.notion.site/">
   <span id="brandWord">koldsleep</span> <span id="archiveLabel">Archive</span>
</a>

<canvas id="koldkitty" width="108" height="72" aria-label="koldkitty"></canvas>

<script>
/* Archive identity: use the contest glyph rules only for the brand word. */
(() => {
const dreamPrintEnglishFonts = [
  'UnifrakturCook', 'Rubik Glitch', 'Monoton', 'Creepster',
  'Metal Mania', 'Press Start 2P', 'Major Mono Display',
  'Fascinate Inline', 'Bungee Shade', 'Codystar', 'Zen Tokyo Zoo',
  'Pirata One', 'New Rocker', 'Black Ops One', 'Oi', 'Nosifer',
  'Rakkas', 'Stardos Stencil', 'Rubik Moonrocks', 'Vast Shadow'
];
const dreamPrintKoreanFonts = [
  'Galmuri11', 'SongMyung', 'GowunBatang', 'NanumMyeongjo'
];
const rand = (min,max) => min + Math.random() * (max-min);

function uniqueFonts(pool, count, requiredFont) {
  // Draw without replacement: different glyphs in one word never reuse a font.
  const available = [...pool];
  const picked = [];
  for (let i = 0; i < count; i++) {
    if (!available.length) throw Error('Insufficient unique font families');
    const idx = Math.floor(Math.random() * available.length);
    picked.push(available.splice(idx, 1)[0]);
  }
  // Each word contains a pixel glyph, as in the earlier title/print identity.
  if (!picked.includes(requiredFont)) {
    picked[Math.floor(Math.random() * picked.length)] = requiredFont;
  }
  return picked;
}

function mixedCaseLetters(word) {
  const letters = [...word].map(ch => Math.random() < .5 ? ch.toUpperCase() : ch.toLowerCase());
  if (letters.every(ch => ch === ch.toUpperCase())) {
    const idx = Math.floor(Math.random() * letters.length);
    letters[idx] = letters[idx].toLowerCase();
  }
  if (letters.every(ch => ch === ch.toLowerCase())) {
    const idx = Math.floor(Math.random() * letters.length);
    letters[idx] = letters[idx].toUpperCase();
  }
  return letters;
}

function buildWord(word, inNav = false) {
  const english = /^koldsleep$/i.test(word);
  const letters = english ? mixedCaseLetters(word) : [...word];
  const pool = english ? dreamPrintEnglishFonts : dreamPrintKoreanFonts;
  const fonts = uniqueFonts(pool, letters.length, english ? 'Press Start 2P' : 'Galmuri11');
  const wrapper = document.createElement('span');
  wrapper.className = 'kw-word';
  wrapper.setAttribute('aria-label', word);
  // Accessibility: one semantic word, rather than nine separately announced letters.
  for (let i = 0; i < letters.length; i++) {
    const glyph = document.createElement('span');
    glyph.className = 'kw-letter';
    glyph.setAttribute('aria-hidden', 'true');
    glyph.textContent = letters[i];
    glyph.style.fontFamily = `"${fonts[i]}", ${english ? 'serif' : 'sans-serif'}`;
    // Like dream-print: vary size, horizontal scale, tracking, baseline.
    // Restrict amplitudes inside the narrow navigation bar.
    glyph.style.setProperty('--kw-size', `${rand(inNav ? .92 : .78, inNav ? 1.06 : 1.28).toFixed(3)}em`);
    glyph.style.setProperty('--kw-stretch', rand(inNav ? .92 : .80, inNav ? 1.08 : 1.23).toFixed(3));
    glyph.style.setProperty('--kw-baseline', `${rand(inNav ? -.04 : -.14, inNav ? .04 : .13).toFixed(3)}em`);
    glyph.style.setProperty('--kw-tracking', `${rand(inNav ? -.09 : -.13, inNav ? 0 : .055).toFixed(3)}em`);
    wrapper.append(glyph);
  }
  return wrapper;
}

const brand = document.getElementById('brandWord');
brand.replaceWith(buildWord('koldsleep'));
})();

/* ============================================================
   KOLDKITTY WEB v1
   ============================================================ */

(() => {
  "use strict";

  const canvas = document.getElementById("koldkitty");
  const ctx = canvas.getContext("2d", { alpha: true });

  ctx.imageSmoothingEnabled = false;

  const GRID_W = 36;
  const GRID_H = 24;
  const PIXEL = 3;

  const W = GRID_W * PIXEL;
  const H = GRID_H * PIXEL;

  const TOP_GAP = 0;

  const DAY_SPEED = 1.6;
  const NIGHT_SPEED = 18.0;
  const FLEE_MULTIPLIER = 2.2;
  const WATCH_SPEED_MULTIPLIER = 0.42;

  const WATCH_RADIUS = 260;
  const FLEE_RADIUS = 105;
  const SURPRISE_DURATION = 340;

  const WALK = 0;
  const SLEEP = 1;

  const KITTY = 0;
  const PAPER = 1;

  const ARCHIVE_URL =
    "https://k0ldsleep.notion.site/";

  const SLEEPINGSTRING_URL =
    "https://sleepingstring.netlify.app/";

  const KOLDSLEEP_URL =
    "https://koldsleep.netlify.app/";

  const PAPER_FALL_DURATION = 4000;

  // The destination is chosen only after a real user click.
  // Navigation happens in this same tab exactly 4 seconds later,
  // which avoids popup blockers and blank-window failures.
  let pendingPortalURL = ARCHIVE_URL;

  let x = Math.max(20, window.innerWidth - W - 40);
  let y = TOP_GAP;

  let direction = -1;

  let state = WALK;
  let stateStarted = performance.now();
  let stateDuration = rand(7000, 18000);

  let form = KITTY;

  let cursorX = -10000;
  let cursorY = -10000;

  let watching = false;
  let fleeing = false;
  let surprised = false;

  let wasInsideFleeRadius = false;
  let surpriseStartedAt = 0;

  let paperStartX = 0;
  let paperVelocityY = 0;
  let paperPhase = 0;
  let paperAngle = 0;
  let paperLanded = false;
  let paperLandedAt = 0;
  let paperStartedAt = 0;
  let paperStartY = 0;
  let paperFallDistance = 220;
  let paperDriftPrimary = 18;
  let paperDriftSecondary = 7;
  let paperWobbleCycles = 1.8;
  let paperAngleAmplitude = 0.35;
  let paperFinalAngle = 0;

  let activeSleepZ = 0;
  let sleepZLiftAmount = 2;
  let sleepZCycleStarted = 0;
  let sleepZCycleDuration = 850;

  let lastFrame = performance.now();

  const walk1Sprite = [
    "....................................",
    "....................................",
    "...##.......##.......................",
    "..####.....####......................",
    ".###############.....................",
    "#################....................",
    ".###############.....................",
    "..##############.....................",
    "..#############......................",
    "...######################...........",
    "....######################..........",
    ".....######################.........",
    "......######################........",
    "......######################........",
    ".......####################.........",
    "........##################..........",
    ".........#####..########............",
    "..........###....#####..............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  const walk2Sprite = [
    "....................................",
    "....................................",
    "...##.......##.......................",
    "..####.....####......................",
    ".###############.....................",
    "#################....................",
    ".###############.....................",
    "..##############.....................",
    "..#############......................",
    "....#####################............",
    ".....######################..........",
    ".....#######################.........",
    "......######################.........",
    ".......#####################.........",
    ".......####################..........",
    "........##################...........",
    ".........#####..#######..............",
    "..........###....#####...............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];

  const watchSprite = walk1Sprite;

  const sleepSprite = [
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    ".....##.......##.....................",
    "....####.....####....................",
    "...###############..................",
    "..#################.................",
    "..########################..........",
    "...##########################.......",
    "....##########################......",
    ".....#########################......",
    "......########################......",
    "........#####################.......",
    "..........#################.........",
    "............############............",
    "...............########.............",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "....................................",
    "...................................."
  ];


  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function isNight() {
    const h = new Date().getHours();
    return h >= 21 || h < 9;
  }

  function currentSpeed() {
    return isNight() ? NIGHT_SPEED : DAY_SPEED;
  }

  function setCanvasPosition() {
    canvas.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
  }

  function clear() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
  }

  function px(gx, gy, color = "#fff") {
    ctx.fillStyle = color;
    ctx.fillRect(gx * PIXEL, gy * PIXEL, PIXEL, PIXEL);
  }

  function drawSprite(sprite) {
    for (let gy = 0; gy < sprite.length; gy++) {
      const row = sprite[gy];
      for (let gx = 0; gx < row.length; gx++) {
        if (row[gx] === "#") {
          px(gx, gy);
        }
      }
    }
  }

  function drawFullerCatFace() {
    // left cheek
    px(1, 6); px(1, 7);
    px(1, 8); px(2, 8);
    px(2, 9); px(3, 9);

    // right cheek — deliberately uneven
    px(15, 6);
    px(15, 7); px(16, 7);
    px(14, 8); px(15, 8);
    px(14, 9);

    // lower face
    px(4, 9); px(5, 9);
    px(11, 9); px(12, 9); px(13, 9);
  }

  function drawFourShortLegs(frame) {
    if (frame === 0) {
      px(9,15); px(9,16); px(8,17); px(7,18);
      px(13,15); px(13,16); px(14,17); px(15,18);
      px(19,15); px(19,16); px(18,17); px(17,18);
      px(23,15); px(23,16); px(24,17); px(25,18);
    } else {
      px(9,15); px(9,16); px(10,17); px(11,18);
      px(13,15); px(13,16); px(12,17); px(11,18);
      px(19,15); px(19,16); px(20,17); px(21,18);
      px(23,15); px(23,16); px(22,17); px(21,18);
    }
  }

  function drawCatTail(frame) {
    if (frame === 0) {
      px(24,13); px(25,13);
      px(26,14); px(27,14); px(28,14);
      px(29,13); px(30,12); px(31,11);
      px(32,10); px(33,9); px(34,8); px(35,8);
    } else {
      px(24,13); px(25,13); px(26,13);
      px(27,14); px(28,14);
      px(29,13); px(30,12); px(31,11);
      px(32,10); px(33,9); px(34,9); px(35,8);
    }
  }

  function drawSleepingTail() {
    px(22,13); px(23,13);
    px(24,14); px(25,14); px(26,14); px(27,14);
    px(28,13); px(29,12); px(30,11);
  }

  function drawWhiskers() {
    ctx.fillStyle = "#fff";

    // left — intentionally unequal
    ctx.fillRect(0, 23, 14, 1);
    ctx.fillRect(2, 28, 12, 1);
    ctx.fillRect(0, 34, 11, 1);

    // right — not mirrored
    ctx.fillRect(38, 22, 15, 1);
    ctx.fillRect(40, 28, 13, 1);
    ctx.fillRect(41, 35, 10, 1);
  }

  function drawSlitEyes() {
    ctx.fillStyle = "#000";
    ctx.fillRect(12, 20, 8, 2);
    ctx.fillRect(28, 21, 8, 2);
  }

  function drawSleepingEyes() {
    ctx.fillStyle = "#000";
    ctx.fillRect(17, 22, 7, 1);
    ctx.fillRect(30, 22, 7, 1);
  }

  function resetSleepZAnimation(now = performance.now()) {
    activeSleepZ = Math.floor(Math.random() * 3);
    sleepZLiftAmount = 1 + Math.floor(Math.random() * 2);
    sleepZCycleDuration = rand(650, 1100);
    sleepZCycleStarted = now;
  }

  function drawSleepZzz(now) {
    if (!sleepZCycleStarted) {
      resetSleepZAnimation(now);
    }

    let elapsed = now - sleepZCycleStarted;

    if (elapsed >= sleepZCycleDuration) {
      activeSleepZ = Math.floor(Math.random() * 3);
      sleepZLiftAmount = 1 + Math.floor(Math.random() * 2);
      sleepZCycleDuration = rand(650, 1100);
      sleepZCycleStarted = now;
      elapsed = 0;
    }

    const t = elapsed / sleepZCycleDuration;
    const lift = Math.round(-sleepZLiftAmount * Math.sin(Math.PI * t));

    const ys = [17, 17, 17];
    ys[activeSleepZ] += lift;

    ctx.fillStyle = "#fff";
    ctx.font = '10pt "Press Start 2P", monospace';
    ctx.textBaseline = "alphabetic";

    ctx.fillText("z", 73, ys[0]);
    ctx.fillText("z", 82, ys[1]);
    ctx.fillText("z", 91, ys[2]);
  }

  function drawBackSpikes() {
    // attached only to the back
    px(13,10); px(13,9); px(12,8);
    px(15,10); px(15,9);
    px(17,10); px(17,9); px(17,8); px(18,7);
    px(20,10); px(20,9); px(21,8);
    px(23,10); px(23,9); px(24,9);
    px(25,11); px(25,10); px(26,9);
  }

  function drawCloseSurprisedEyes() {
    ctx.fillStyle = "#000";

    // left O
    ctx.fillRect(16,17,8,3);
    ctx.fillRect(16,28,8,3);
    ctx.fillRect(13,20,3,8);
    ctx.fillRect(24,20,3,8);

    // right O, very close
    ctx.fillRect(28,17,8,3);
    ctx.fillRect(28,28,8,3);
    ctx.fillRect(26,20,3,8);
    ctx.fillRect(36,20,3,8);
  }

  function drawPaper() {
    ctx.save();

    ctx.translate(W / 2, H / 2);
    ctx.rotate(paperAngle);
    ctx.translate(-W / 2, -H / 2);

    const paperX = 12 * PIXEL;
    const paperY = 3 * PIXEL;
    const paperW = 11 * PIXEL;
    const paperH = 15 * PIXEL;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(paperX, paperY, paperW, paperH);

    // nominal 1 CSS/canvas pixel gray outline
    ctx.strokeStyle = "#b9b9b9";
    ctx.lineWidth = 1;
    ctx.strokeRect(paperX + 0.5, paperY + 0.5, paperW - 1, paperH - 1);

    ctx.restore();
  }

  function drawCat(now) {
    if (state === SLEEP && !surprised && !fleeing) {
      drawSprite(sleepSprite);
      drawSleepingTail();
      drawSleepingEyes();
      drawSleepZzz(now);
      return;
    }

    const frameSpeed = (fleeing || isNight()) ? 45 : 180;
    const frame = Math.floor(now / frameSpeed) % 2;

    let sprite;
    if (watching || surprised) {
      sprite = watchSprite;
    } else {
      sprite = frame === 0 ? walk1Sprite : walk2Sprite;
    }

    ctx.save();

    if (direction === 1) {
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
    }

    drawSprite(sprite);
    drawFullerCatFace();
    drawFourShortLegs(frame);
    drawCatTail(frame);
    drawWhiskers();

    if (surprised || fleeing) {
      drawBackSpikes();
      drawCloseSurprisedEyes();
    } else {
      drawSlitEyes();
    }

    ctx.restore();
  }

  function lookAtCursor() {
    const center = x + W / 2;
    direction = cursorX < center ? -1 : 1;
  }

  function updateCursorInteraction(now) {
    const centerX = x + W / 2;
    const centerY = y + H / 2;

    const dx = cursorX - centerX;
    const dy = cursorY - centerY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < FLEE_RADIUS) {
      if (!wasInsideFleeRadius) {
        surpriseStartedAt = now;

        if (state === SLEEP) {
          state = WALK;
          stateStarted = now;
          stateDuration = rand(7000, 19000);
        }
      }

      wasInsideFleeRadius = true;

      if (now - surpriseStartedAt < SURPRISE_DURATION) {
        surprised = true;
        fleeing = false;
        watching = false;
      } else {
        surprised = false;
        fleeing = true;
        watching = false;
      }
    } else if (distance < WATCH_RADIUS) {
      wasInsideFleeRadius = false;
      surprised = false;
      fleeing = false;
      watching = state === WALK;
    } else {
      wasInsideFleeRadius = false;
      surprised = false;
      fleeing = false;
      watching = false;
    }
  }

  function constrainX() {
    const maxX = Math.max(0, window.innerWidth - W);

    if (x < 0) {
      x = 0;
      direction = 1;
    }

    if (x > maxX) {
      x = maxX;
      direction = -1;
    }
  }

  function chooseNextState(now) {
    if (state === WALK) {
      state = SLEEP;
      resetSleepZAnimation(now);
      stateDuration = rand(7000, 26000);
    } else {
      state = WALK;
      stateDuration = rand(7000, 19000);

      if (Math.random() < 0.40) {
        direction *= -1;
      }
    }

    stateStarted = now;
  }

  function choosePortalDestination() {
    const roll = Math.random();

    // Web beta excludes Instagram. Remaining desktop weights (10:20:20)
    // are normalized to Archive 20% / Sleeping String 40% / Hoop Ring Chime 40%.
    if (roll < 0.20) {
      pendingPortalURL = ARCHIVE_URL;
      return;
    }

    if (roll < 0.60) {
      pendingPortalURL = SLEEPINGSTRING_URL;
      return;
    }

    pendingPortalURL = KOLDSLEEP_URL;
  }

  function turnIntoPaper(now = performance.now()) {
    // This is the ONLY place where KITTY -> PAPER is allowed.
    form = PAPER;

    watching = false;
    fleeing = false;
    surprised = false;
    wasInsideFleeRadius = false;

    // Choose exactly one destination for this click.
    choosePortalDestination();

    paperStartX = x;
    paperStartY = y;

    const availableDown = Math.max(0, window.innerHeight - H - paperStartY);
    const minFall = Math.min(80, availableDown);
    const maxFall = Math.min(360, availableDown);
    paperFallDistance = maxFall <= minFall ? availableDown : rand(minFall, maxFall);
    paperDriftPrimary = rand(8, 26);
    paperDriftSecondary = rand(2, 10);
    paperWobbleCycles = rand(1.1, 2.5);
    paperAngleAmplitude = rand(0.16, 0.46);
    paperFinalAngle = rand(-0.18, 0.18);

    paperStartedAt = now;
    paperVelocityY = 0;
    paperPhase = 0;
    paperAngle = -0.20;
    paperLanded = false;
    paperLandedAt = 0;
  }

  function navigateToPortal() {
    // Same-tab navigation is intentionally used here.
    // Unlike delayed window.open(), this is not subject to popup blocking.
    window.location.assign(pendingPortalURL);
  }

  function respawn() {
    form = KITTY;
    state = WALK;

    x = rand(
      20,
      Math.max(21, window.innerWidth - W - 20)
    );

    y = TOP_GAP;

    direction = Math.random() < 0.5 ? -1 : 1;

    stateStarted = performance.now();
    stateDuration = rand(7000, 18000);

    paperLanded = false;
    paperLandedAt = 0;
    paperStartedAt = 0;
    paperStartY = TOP_GAP;
  }

  function updatePaper(now, frameScale) {
    if (paperLanded) return;

    const elapsed = Math.max(0, now - paperStartedAt);
    const t = Math.min(1, elapsed / PAPER_FALL_DURATION);
    const eased = t * (0.92 + 0.08 * t);
    const targetY = Math.min(window.innerHeight - H, paperStartY + paperFallDistance);
    const phase = t * Math.PI * 2 * paperWobbleCycles;

    x =
      paperStartX +
      Math.sin(phase) * paperDriftPrimary +
      Math.sin(phase * 0.43 + 0.8) * paperDriftSecondary;

    x = Math.max(0, Math.min(window.innerWidth - W, x));
    y = paperStartY + (targetY - paperStartY) * eased;
    paperAngle = Math.sin(phase * 1.15) * paperAngleAmplitude;

    if (t >= 1) {
      y = targetY;
      paperAngle = paperFinalAngle;
      paperLanded = true;
      paperLandedAt = now;

      // Exactly 4 seconds after a genuine cat click, navigate in this tab.
      navigateToPortal();
    }
  }

  function update(now, dt) {
    const frameScale = Math.min(2.0, Math.max(0.1, dt / 33.333));

    if (form === PAPER) {
      updatePaper(now, frameScale);
      return;
    }

    updateCursorInteraction(now);

    if (surprised) {
      lookAtCursor();
    } else if (fleeing) {
      const center = x + W / 2;
      direction = cursorX < center ? 1 : -1;
      x += currentSpeed() * FLEE_MULTIPLIER * direction * frameScale;
    } else if (watching && state === WALK) {
      x += currentSpeed() * WATCH_SPEED_MULTIPLIER * direction * frameScale;
    } else if (state === WALK) {
      x += currentSpeed() * direction * frameScale;
    }

    if (!surprised && !fleeing && now - stateStarted > stateDuration) {
      chooseNextState(now);
    }

    constrainX();
  }

  function render(now) {
    clear();

    if (form === PAPER) {
      drawPaper();
    } else {
      drawCat(now);
    }

    setCanvasPosition();
  }

  function loop(now) {
    const dt = now - lastFrame;
    lastFrame = now;

    update(now, dt);
    render(now);

    requestAnimationFrame(loop);
  }

  window.addEventListener("pointermove", (e) => {
    cursorX = e.clientX;
    cursorY = e.clientY;
  }, { passive: true });

  canvas.addEventListener("click", (e) => {
    // Only a genuine user click can transform the cat.
    // Programmatic/synthetic events cannot trigger the paper state.
    if (!e.isTrusted) return;
    if (e.button !== 0) return;
    if (form !== KITTY) return;

    e.preventDefault();
    e.stopPropagation();

    turnIntoPaper(performance.now());
  });

  window.addEventListener("resize", () => {
    constrainX();

    if (form === KITTY) {
      y = TOP_GAP;
    }
  });

  setCanvasPosition();
  requestAnimationFrame((now) => {
    lastFrame = now;
    requestAnimationFrame(loop);
  });
})();
</script>

</body>
</html>
